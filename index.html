<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Dashboard de Gestão Financeira e Coordenação - Roça 2.0" />
  <title>Divisão Roça 2.0 🌾</title>

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & RESET
       ========================================================================== */
    :root {
      --color-bg-primary: #0f172a;
      --color-bg-surface: #1e293b;
      --color-bg-elevated: #334155;
      --color-bg-overlay: rgba(15, 23, 42, 0.85);

      --color-text-main: #f8fafc;
      --color-text-muted: #94a3b8;
      --color-accent-amber: #f59e0b;
      --color-accent-sky: #38bdf8;
      --color-accent-emerald: #22c55e;
      --color-accent-rose: #f87171;

      --color-border: #334155;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 14px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.5);

      --transition-fast: 0.15s ease;
      --transition-normal: 0.2s ease;
      --container-max-width: 860px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--color-bg-primary);
      color: var(--color-text-main);
      padding: 0 16px 40px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: var(--container-max-width);
      position: relative;
    }

    /* ==========================================================================
       2. COMPONENTES: NAVEGAÇÃO & TOPO
       ========================================================================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 20px;
    }

    .btn-icon {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-main);
      font-size: 1.25rem;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--transition-normal);
    }

    .btn-icon:hover {
      background: var(--color-bg-elevated);
    }

    .btn-primary {
      background: var(--color-accent-emerald);
      border: none;
      color: var(--color-bg-primary);
      font-weight: 700;
      padding: 8px 20px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity var(--transition-normal);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--color-bg-elevated);
      color: var(--color-text-main);
      border: 1px solid var(--color-border);
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color var(--transition-normal);
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      color: var(--color-accent-amber);
      margin-bottom: 4px;
    }

    header p {
      font-size: clamp(0.82rem, 2.5vw, 0.95rem);
      color: var(--color-text-muted);
    }

    /* ==========================================================================
       3. COMPONENTES: CONTAGEM DECRESCENTE
       ========================================================================== */
    .countdown-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .countdown-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-accent-amber);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .countdown-grid {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .countdown-unit {
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      min-width: 65px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-number {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-accent-sky);
    }

    .countdown-label {
      font-size: 0.68rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    /* ==========================================================================
       4. COMPONENTES: CARTÕES DE DESPESAS
       ========================================================================== */
    .expense-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: clamp(12px, 3vw, 18px);
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
    }

    .expense-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 10px;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .expense-title {
      font-weight: 700;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .expense-val {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-accent-sky);
      text-align: right;
    }

    .expense-status-row {
      font-size: 0.8rem;
      margin-top: 4px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .progress-wrapper {
      margin-bottom: 12px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--color-accent-emerald);
      border-radius: 999px;
      width: 0%;
      transition: width 0.25s ease;
    }

    .progress-bar-fill.complete {
      background: #10b981;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-top: 5px;
    }

    .pix-box {
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      margin-bottom: 14px;
      color: var(--color-text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pix-box strong {
      color: var(--color-text-main);
    }

    .copy-btn {
      background: #3b82f6;
      border: none;
