<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Divisão Roça 2.0 🌾</title>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 0 16px 32px 16px; 
      display: flex; 
      justify-content: center; 
    }
    .container { width: 100%; max-width: 650px; position: relative; }
    
    /* Barra Superior Fixa (Sticky) */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .sync-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--muted);
      user-select: none;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      transition: background 0.3s ease;
    }
    .status-dot.syncing {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      animation: pulse 1s infinite alternate;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .action-btn-top {
      background: #334155;
      color: #f8fafc;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .action-btn-top:hover {
      background: #475569;
    }

    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; color: #f59e0b; margin-bottom: 6px; }
    p.sub { font-size: 0.9rem; color: var(--muted); }

    .expense-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .expense-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .expense-title { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
    .expense-val { font-size: 0.95rem; font-weight: 600; color: #38bdf8; text-align: right; }
    .expense-status-row {
      font-size: 0.78rem;
      margin-top: 3px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .progress-wrapper { margin-bottom: 10px; }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width 0.25s ease;
    }
    .progress-bar-fill.complete { background: #10b981; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .pix-box {
      font-size: 0.8rem;
      background: rgba(0,0,0,0.25);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pix-box strong { color: var(--text); }
    .copy-btn {
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Botão especial da Lista de Compras dentro de Comidas */
    .checklist-btn {
      width: 100%;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .checklist-btn:hover {
      background: rgba(56, 189, 248, 0.22);
    }

    .people-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }
    .person-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .person-chip.paid {
      background: rgba(34, 197, 94, 0.15);
      border-color: var(--accent);
      color: #86efac;
    }
    .person-chip input { cursor: pointer; accent-color: var(--accent); }
    .excluded-tag { font-size: 0.75rem; color: #64748b; font-style: italic; }

    .summary-card {
      background: #1e1b4b;
      border: 1px solid #4338ca;
      border-radius: 12px;
      padding: 16px;
      margin-top: 24px;
    }
    .summary-header {
      font-size: 1.1rem;
      color: #a5b4fc;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-list { display: flex; flex-direction: column; gap: 8px; }
    .summary-row {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #312e81;
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    .summary-row.fully-paid {
      border-color: var(--accent);
      background: rgba(34, 197, 94, 0.08);
    }
    .summary-details { text-align: right; font-size: 0.8rem; }
    .text-paid { color: #86efac; font-weight: 600; }
    .text-pending { color: #f87171; font-weight: 600; }

    /* Rodapé */
    .footer-section {
      margin-top: 24px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .whatsapp-footer-btn {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .whatsapp-footer-btn:hover {
      background: rgba(34, 197, 94, 0.25);
    }

    /* Modais */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 580px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.1rem; color: #f59e0b; }
    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .edit-item-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .edit-item-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #38bdf8;
      font-size: 0.95rem;
    }
    .edit-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .form-group input {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: #192231;
      border-radius: 0 0 12px 12px;
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      color: #0f172a;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Estilos do Checklist de Compras */
    .grocery-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .grocery-item.bought {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.4);
    }
    .grocery-item.bought .grocery-text {
      text-decoration: line-through;
      color: #64748b;
    }
    .grocery-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .grocery-qty {
      font-size: 0.8rem;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Barra Superior Fixa (Sticky) -->
    <div class="top-bar">
      <div class="sync-badge" id="sync-badge">
        <span class="status-dot" id="sync-dot"></span>
        <span id="sync-text">Conectando...</span>
      </div>

      <button class="action-btn-top" onclick="openEditModal()">
        ⚙️ Editar Gastos / PIX
      </button>
    </div>

    <header>
      <h1>🌾 Roça 2.0 (30/10 a 02/11)</h1>
      <p class="sub">Marque conforme for pagando o PIX para cada responsável</p>
    </header>

    <div id="expenses-container"></div>

    <!-- Painel de Resumo por Participante -->
    <div class="summary-card">
      <div class="summary-header">
        <span>📊 Resumo por Participante</span>
      </div>
      <div id="summary-container" class="summary-list"></div>
      <p style="font-size: 0.75rem; color: #a5b4fc; text-align: center; margin-top: 12px;">
        * Itens sem valor preenchido não entram na soma até que o valor seja definido.
      </p>
    </div>

    <!-- Rodapé: Copiar Relatório -->
    <div class="footer-section">
      <button class="whatsapp-footer-btn" onclick="copyWhatsAppReport()">
        📋 Copiar Relatório para WhatsApp
      </button>
    </div>

  </div>

  <!-- Modal de Edição de Gastos -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Editar Gastos e Chaves PIX</h3>
        <button class="close-modal-btn" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="saveExpensesFromModal()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <!-- Modal da Lista de Compras (Comidas) -->
  <div id="grocery-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 style="color: #38bdf8;">🛒 Lista de Compras (Comidas)</h3>
          <span id="grocery-counter" style="font-size: 0.75rem; color: var(--muted);"></span>
        </div>
        <button class="close-modal-btn" onclick="closeGroceryModal()">&times;</button>
      </div>
      <div class="modal-body" id="grocery-list-container"></div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="closeGroceryModal()">Fechar Lista</button>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_ENDPOINT = "https://roca2-37116-default-rtdb.firebaseio.com/dados_compartilhados.json";

    // Participantes em estrita ordem alfabética
    const PARTICIPANTS = [
      "Alexandre", "Emiliano", "Guilherme", "Gustavo",
      "Jeferson", "Lucas", "Matheus", "Paulinho", "Thiago"
    ];

    // Despesas em estrita ordem alfabética
    const DEFAULT_EXPENSES = [
      {
        id: "carros",
        name: "🚗 Carros",
        total: 1373.34,
        responsible: "Paulinho",
        pix: "61992727661",
        pixDisplay: "61 99272-7661",
        excluded: ["Jeferson"]
      },
      {
        id: "chopp",
        name: "🍺 Chopp",
        total: 1090.00,
        responsible: "Paulinho",
        pix: "61992727661",
        pixDisplay: "61 99272-7661",
        excluded: []
      },
      {
        id: "combustivel",
        name: "⛽ Combustível",
        total: null,
        responsible: "Jeferson",
        pix: "61982355635",
        pixDisplay: "61 98235-5635",
        excluded: []
      },
      {
        id: "comidas",
        name: "🍽️ Comidas",
        total: null,
        responsible: "Jeferson",
        pix: "61982355635",
        pixDisplay: "61 98235-5635",
        excluded: []
      },
      {
        id: "costela",
        name: "🥩 Costela",
        total: null,
        responsible: "Alexandre",
        pix: "",
        pixDisplay: "A definir",
        excluded: []
      },
      {
        id: "narguile",
        name: "💨 Narguilé",
        total: null,
        responsible: "Steffano Santos",
        pix: "",
        pixDisplay: "A definir",
        excluded: ["Jeferson"]
      }
    ];

    // Itens da planilha organizados em estrita ordem alfabética
    const GROCERY_ITEMS = [
      { id: "alho", name: "Alho", qty: "1 pote" },
      { id: "arroz", name: "Arroz", qty: "1 pct" },
      { id: "batata", name: "Batata", qty: "" },
      { id: "cafe", name: "Café", qty: "1 pct" },
      { id: "calabresa", name: "Calabresa", qty: "3 uni" },
      { id: "cebola", name: "Cebola", qty: "" },
      { id: "cenoura", name: "Cenoura", qty: "" },
      { id: "desinfetante", name: "Desinfetante", qty: "1 l" },
      { id: "descartaveis", name: "Descartáveis", qty: "" },
      { id: "feijao_carioca", name: "Feijão Carioca", qty: "1 pct" },
      { id: "feijao_corda", name: "Feijão de Corda", qty: "1 pct" },
      { id: "leite", name: "Leite", qty: "5" },
      { id: "macarrao", name: "Macarrão", qty: "1 kg" },
      { id: "molho_tomate", name: "Molho de Tomate", qty: "3" },
      { id: "mussarela", name: "Mussarela", qty: "500 gm" },
      { id: "oleo", name: "Óleo", qty: "1 l" },
      { id: "ovo", name: "Ovo", qty: "30 uni" },
      { id: "pao_forma", name: "Pão de Forma", qty: "3 pct" },
      { id: "pao_queijo", name: "Pão de Queijo", qty: "200 uni" },
      { id: "papel_higienico", name: "Papel Higiênico", qty: "1 pct" },
      { id: "pimentao", name: "Pimentão", qty: "" },
      { id: "presunto", name: "Presunto", qty: "gm" },
      { id: "qboa", name: "Qboa", qty: "1 l" },
      { id: "saco_lixo", name: "Saco de Lixo Grande", qty: "1 pct" },
      { id: "sal_grosso", name: "Sal Grosso", qty: "1 pote" },
      { id: "tomate", name: "Tomate", qty: "" }
    ].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));

    let EXPENSES = JSON.parse(JSON.stringify(DEFAULT_EXPENSES));
    let PAYMENTS = {};
    let GROCERY_STATUS = {};
    let isSaving = false;
    let hasLoadedCloudOnce = false;

    function cleanName(name) {
      return name.replace(/[^\w\sÀ-ÿ]/gi, '').trim();
    }

    function setSyncStatus(state, msg) {
      const dot = document.getElementById("sync-dot");
      const text = document.getElementById("sync-text");
      if (!dot || !text) return;

      dot.className = "status-dot";
      if (state === "syncing") {
        dot.classList.add("syncing");
        text.textContent = msg || "Sincronizando...";
      } else if (state === "offline") {
        dot.classList.add("offline");
        text.textContent = msg || "Offline (salvo local)";
      } else {
        text.textContent = msg || "Sincronizado na nuvem";
      }
    }

    function loadLocal() {
      try {
        const savedExp = localStorage.getItem("roca_expenses_data");
        if (savedExp) {
          const parsed = JSON.parse(savedExp);
          if (Array.isArray(parsed) && parsed.length > 0) EXPENSES = parsed;
        }
      } catch(e) {}

      try {
        const savedPay = localStorage.getItem("roca_payments_data");
        if (savedPay) PAYMENTS = JSON.parse(savedPay) || {};
      } catch(e) {}

      try {
        const savedGroc = localStorage.getItem("roca_grocery_data");
        if (savedGroc) GROCERY_STATUS = JSON.parse(savedGroc) || {};
      } catch(e) {}
    }

    function saveLocal() {
      try {
        localStorage.setItem("roca_expenses_data", JSON.stringify(EXPENSES));
        localStorage.setItem("roca_payments_data", JSON.stringify(PAYMENTS));
        localStorage.setItem("roca_grocery_data", JSON.stringify(GROCERY_STATUS));
      } catch(e) {}
    }

    async function syncToCloud() {
      isSaving = true;
      saveLocal();
      if (!navigator.onLine) {
        setSyncStatus("offline");
        isSaving = false;
        return;
      }

      setSyncStatus("syncing", "Salvando na nuvem...");
      try {
        const payload = JSON.stringify({
          expenses: EXPENSES,
          payments: PAYMENTS,
          grocery: GROCERY_STATUS,
          lastUpdated: Date.now()
        });

        const res = await fetch(FIREBASE_ENDPOINT, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: payload
        });

        if (res.ok) {
          setSyncStatus("online", "Sincronizado na nuvem");
          hasLoadedCloudOnce = true;
        } else {
          setSyncStatus("offline", "Ajuste Regras no Firebase");
        }
      } catch (err) {
        setSyncStatus("offline", "Offline (salvo local)");
      } finally {
        setTimeout(() => { isSaving = false; }, 400);
      }
    }

    async function syncFromCloud() {
      if (isSaving || !navigator.onLine) return;

      try {
        const res = await fetch(FIREBASE_ENDPOINT + "?t=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.expenses) && data.expenses.length > 0) {
            EXPENSES = data.expenses;
            PAYMENTS = data.payments || {};
            GROCERY_STATUS = data.grocery || {};
            saveLocal();
            render();
            renderGroceryList();
            setSyncStatus("online", "Sincronizado na nuvem");
            hasLoadedCloudOnce = true;
          } else if (data === null && !hasLoadedCloudOnce) {
            syncToCloud();
          }
        }
      } catch (err) {
        setSyncStatus("offline", "Offline (salvo local)");
      }
    }

    window.addEventListener('online', () => {
      setSyncStatus("syncing", "Reconectando...");
      syncFromCloud();
    });
    window.addEventListener('offline', () => {
      setSyncStatus("offline");
    });

    function formatBRL(val) {
      return (val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function copyPix(key) {
      if (!key) return;
      navigator.clipboard.writeText(key);
      alert("Chave PIX copiada: " + key);
    }

    function togglePay(expId, person) {
      const key = `${expId}_${person}`;
      PAYMENTS[key] = !PAYMENTS[key];
      render();
      syncToCloud();
    }

    function toggleGroceryItem(itemId) {
      GROCERY_STATUS[itemId] = !GROCERY_STATUS[itemId];
      renderGroceryList();
      render();
      syncToCloud();
    }

    function openGroceryModal() {
      renderGroceryList();
      document.getElementById("grocery-modal").classList.add("active");
    }

    function closeGroceryModal() {
      document.getElementById("grocery-modal").classList.remove("active");
    }

    function renderGroceryList() {
      const container = document.getElementById("grocery-list-container");
      if (!container) return;
      container.innerHTML = "";

      let boughtCount = 0;
      GROCERY_ITEMS.forEach(item => {
        const isBought = !!GROCERY_STATUS[item.id];
        if (isBought) boughtCount++;

        const row = document.createElement("div");
        row.className = `grocery-item ${isBought ? 'bought' : ''}`;
        row.onclick = () => toggleGroceryItem(item.id);

        row.innerHTML = `
          <div class="grocery-left">
            <input type="checkbox" ${isBought ? 'checked' : ''} style="cursor: pointer; accent-color: var(--accent);" onclick="event.stopPropagation(); toggleGroceryItem('${item.id}')">
            <span class="grocery-text" style="font-weight: 500;">${item.name}</span>
          </div>
          ${item.qty ? `<span class="grocery-qty">${item.qty}</span>` : ''}
        `;
        container.appendChild(row);
      });

      const counter = document.getElementById("grocery-counter");
      if (counter) {
        counter.textContent = `${boughtCount} de ${GROCERY_ITEMS.length} itens comprados`;
      }
    }

    function copyWhatsAppReport() {
      let report = `🌾 *STATUS DE PAGAMENTOS - ROÇA 2.0* 🌾\n`;
      report += `📅 *Período:* 30/10 a 02/11\n`;
      report += `------------------------------------\n\n`;

      report += `📋 *DESPESAS E ARRECADAÇÃO:*\n`;
      
      const balances = {};
      const sortedParticipants = [...PARTICIPANTS].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      sortedParticipants.forEach(p => {
        balances[p] = { totalOwed: 0, totalPaid: 0 };
      });

      const sortedExpenses = [...EXPENSES].sort((a, b) => cleanName(a.name).localeCompare(cleanName(b.name), 'pt-BR'));

      sortedExpenses.forEach(exp => {
        const excluded = exp.excluded || [];
        const activePeople = sortedParticipants.filter(p => !excluded.includes(p));
        const activeCount = activePeople.length;
        const hasDefined = typeof exp.total === 'number' && exp.total > 0 && activeCount > 0;
        const perPersonVal = hasDefined ? exp.total / activeCount : 0;

        let paidCount = 0;
        const pendingNames = [];

        activePeople.forEach(person => {
          const isPaid = !!PAYMENTS[`${exp.id}_${person}`];
          if (isPaid) {
            paidCount++;
          } else {
            pendingNames.push(person);
          }

          if (perPersonVal > 0) {
            balances[person].totalOwed += perPersonVal;
            if (isPaid) balances[person].totalPaid += perPersonVal;
          }
        });

        pendingNames.sort((a, b) => a.localeCompare(b, 'pt-BR'));

        report += `• *${exp.name}*`;
        if (hasDefined) {
          report += ` (${formatBRL(perPersonVal)}/pessoa)\n`;
          report += `  Progresso: ${paidCount}/${activeCount} pagos\n`;
          if (pendingNames.length > 0) {
            report += `  ⏳ *Falta:* ${pendingNames.join(", ")}\n`;
          } else {
            report += `  ✅ *100% arrecadado!*\n`;
          }
        } else {
          report += ` (Valor a definir)\n`;
        }
        report += `\n`;
      });

      report += `------------------------------------\n`;
      report += `👤 *RESUMO INDIVIDUAL (QUANTO FALTA):*\n`;

      sortedParticipants.forEach(person => {
        const { totalOwed, totalPaid } = balances[person];
        const pending = Math.max(0, totalOwed - totalPaid);

        if (totalOwed === 0) {
          report += `• ${person}: Nenhum valor pendente\n`;
        } else if (pending < 0.01) {
          report += `• *${person}*: ✅ Quitado! (Total: ${formatBRL(totalPaid)})\n`;
        } else {
          report += `• *${person}*: Deve ${formatBRL(pending)} (Pago: ${formatBRL(totalPaid)} / Total: ${formatBRL(totalOwed)})\n`;
        }
      });

      report += `\n------------------------------------\n`;
      report += `🔑 *CHAVES PIX PARA PAGAMENTO:*\n`;
      
      const addedPix = new Map();
      sortedExpenses.forEach(exp => {
        if (exp.pix && exp.pix.trim() && !addedPix.has(exp.responsible)) {
          addedPix.set(exp.responsible, exp.pixDisplay || exp.pix);
        }
      });

      Array.from(addedPix.entries())
        .sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'))
        .forEach(([resp, key]) => {
          report += `• ${resp}: \`${key}\`\n`;
        });

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(report).then(() => {
          alert("📋 Relatório copiado para a área de transferência!");
        }).catch(() => fallbackCopy(report));
      } else {
        fallbackCopy(report);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        alert("📋 Relatório copiado com sucesso!");
      } catch (err) {
        prompt("Copie o relatório abaixo:", text);
      }
      document.body.removeChild(textarea);
    }

    function render() {
      const container = document.getElementById("expenses-container");
      if (!container) return;
      container.innerHTML = "";

      const balances = {};
      const sortedParticipants = [...PARTICIPANTS].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      sortedParticipants.forEach(p => {
        balances[p] = { totalOwed: 0, totalPaid: 0 };
      });

      const sortedExpenses = [...EXPENSES].sort((a, b) => cleanName(a.name).localeCompare(cleanName(b.name), 'pt-BR'));

      sortedExpenses.forEach(exp => {
        const card = document.createElement("div");
        card.className = "expense-card";

        const hasPix = exp.pix && exp.pix.trim().length > 0;
        const copyBtn = hasPix ? `<button class="copy-btn" onclick="copyPix('${exp.pix}')">Copiar PIX</button>` : '';

        const excluded = exp.excluded || [];
        // Separa quem participa e quem não entra na soma
        const activeList = sortedParticipants.filter(p => !excluded.includes(p));
        const excludedList = sortedParticipants.filter(p => excluded.includes(p));
        const activeCount = activeList.length;
        
        let perPersonVal = 0;
        let perPersonText = "A Definir";
        let totalText = "A Definir";
        let hasDefinedValue = typeof exp.total === 'number' && exp.total > 0 && activeCount > 0;

        if (hasDefinedValue) {
          perPersonVal = exp.total / activeCount;
          perPersonText = `${formatBRL(perPersonVal)} / pessoa`;
          totalText = formatBRL(exp.total);
        }

        let paidCountInExp = 0;
        let peopleHtml = "";

        // 1. Participantes ativos primeiro (em ordem alfabética)
        activeList.forEach(person => {
          const key = `${exp.id}_${person}`;
          const isPaid = !!PAYMENTS[key];
          
          if (isPaid) {
            paidCountInExp++;
          }

          if (perPersonVal > 0) {
            balances[person].totalOwed += perPersonVal;
            if (isPaid) {
              balances[person].totalPaid += perPersonVal;
            }
          }

          peopleHtml += `
            <label class="person-chip ${isPaid ? 'paid' : ''}">
              <input type="checkbox" ${isPaid ? 'checked' : ''} onchange="togglePay('${exp.id}', '${person}')">
              <span>${person}</span>
            </label>
          `;
        });

        // 2. Participantes que não entram na soma ficam abaixo (no final)
        excludedList.forEach(person => {
          peopleHtml += `
            <div class="person-chip" style="opacity: 0.4; cursor: not-allowed;">
              <span class="excluded-tag">${person} (não entra)</span>
            </div>
          `;
        });

        let statusHtml = '';
        let progressHtml = '';

        if (hasDefinedValue) {
          const paidAmount = perPersonVal * paidCountInExp;
          const pendingAmount = Math.max(0, exp.total - paidAmount);
          const percent = activeCount > 0 ? Math.round((paidCountInExp / activeCount) * 100) : 0;
          const isComplete = percent >= 100;

          statusHtml = `
            <div class="expense-status-row">
              <span>Pago: <strong class="text-paid">${formatBRL(paidAmount)}</strong></span>
              <span>Pendente: <strong class="text-pending">${formatBRL(pendingAmount)}</strong></span>
            </div>
          `;

          progressHtml = `
            <div class="progress-wrapper">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill ${isComplete ? 'complete' : ''}" style="width: ${percent}%;"></div>
              </div>
              <div class="progress-label">
                <span>${paidCountInExp} de ${activeCount} pagos</span>
                <span>${percent}% arrecadado</span>
              </div>
            </div>
          `;
        } else {
          statusHtml = `
            <div class="expense-status-row">
              <span style="color: var(--muted);">Valores pendentes de definição</span>
            </div>
          `;
        }

        let checklistBtnHtml = '';
        if (exp.id === 'comidas') {
          const boughtTotal = Object.values(GROCERY_STATUS).filter(Boolean).length;
          checklistBtnHtml = `
            <button class="checklist-btn" onclick="openGroceryModal()">
              📝 Ver Lista de Compras (${boughtTotal}/${GROCERY_ITEMS.length} comprados)
            </button>
          `;
        }

        card.innerHTML = `
          <div class="expense-header">
            <div>
              <span class="expense-title">${exp.name}</span>
              <span style="font-size: 0.8rem; color: var(--muted);">${totalText} (${activeCount} pessoas)</span>
            </div>
            <div>
              <div class="expense-val">${perPersonText}</div>
              ${statusHtml}
            </div>
          </div>
          ${progressHtml}
          ${checklistBtnHtml}
          <div class="pix-box">
            <span>Resp: <strong>${exp.responsible || 'A definir'}</strong> | PIX: <strong>${exp.pixDisplay || exp.pix || 'A definir'}</strong></span>
            ${copyBtn}
          </div>
          <div class="people-grid">
            ${peopleHtml}
          </div>
        `;
        container.appendChild(card);
      });

      renderSummary(balances, sortedParticipants);
    }

    function renderSummary(balances, sortedParticipants) {
      const summaryContainer = document.getElementById("summary-container");
      if (!summaryContainer) return;
      summaryContainer.innerHTML = "";

      sortedParticipants.forEach(person => {
        const { totalOwed, totalPaid } = balances[person];
        const pending = Math.max(0, totalOwed - totalPaid);
        const isFullyPaid = totalOwed > 0 && pending < 0.01;

        const row = document.createElement("div");
        row.className = `summary-row ${isFullyPaid ? 'fully-paid' : ''}`;

        row.innerHTML = `
          <div>
            <strong>${person}</strong>
            ${isFullyPaid ? '<span style="color: #86efac; font-size: 0.8rem; margin-left: 6px;">✓ Quitado</span>' : ''}
          </div>
          <div class="summary-details">
            <div>Total: <strong>${formatBRL(totalOwed)}</strong></div>
            <div>
              Pago: <span class="text-paid">${formatBRL(totalPaid)}</span> | 
              Pendente: <span class="text-pending">${formatBRL(pending)}</span>
            </div>
          </div>
        `;
        summaryContainer.appendChild(row);
      });
    }

    function openEditModal() {
      const modalBody = document.getElementById("modal-body");
      if (!modalBody) return;
      modalBody.innerHTML = "";

      const sortedExpenses = [...EXPENSES].sort((a, b) => cleanName(a.name).localeCompare(cleanName(b.name), 'pt-BR'));

      sortedExpenses.forEach(exp => {
        const item = document.createElement("div");
        item.className = "edit-item-card";
        item.innerHTML = `
          <div class="edit-item-title">${exp.name}</div>
          <div class="edit-form-grid">
            <div class="form-group">
              <label>Valor Total (R$)</label>
              <input type="number" step="0.01" id="modal_total_${exp.id}" value="${exp.total !== null ? exp.total : ''}" placeholder="Ex: 500.00">
            </div>
            <div class="form-group">
              <label>Responsável</label>
              <input type="text" id="modal_resp_${exp.id}" value="${exp.responsible || ''}" placeholder="Nome">
            </div>
            <div class="form-group">
              <label>Chave PIX (só dígitos ou chave)</label>
              <input type="text" id="modal_pix_${exp.id}" value="${exp.pix || ''}" placeholder="Ex: 61999999999">
            </div>
            <div class="form-group">
              <label>Exibição do PIX</label>
              <input type="text" id="modal_disp_${exp.id}" value="${exp.pixDisplay || ''}" placeholder="Ex: 61 99999-9999">
            </div>
          </div>
        `;
        modalBody.appendChild(item);
      });

      document.getElementById("edit-modal").classList.add("active");
    }

    function closeEditModal() {
      document.getElementById("edit-modal").classList.remove("active");
    }

    function saveExpensesFromModal() {
      EXPENSES.forEach(exp => {
        const totalInput = document.getElementById(`modal_total_${exp.id}`);
        const respInput = document.getElementById(`modal_resp_${exp.id}`);
        const pixInput = document.getElementById(`modal_pix_${exp.id}`);
        const dispInput = document.getElementById(`modal_disp_${exp.id}`);

        if (totalInput) {
          const val = totalInput.value.trim();
          exp.total = val !== "" && !isNaN(val) ? parseFloat(val) : null;
        }
        if (respInput) exp.responsible = respInput.value.trim() || "A definir";
        if (pixInput) exp.pix = pixInput.value.trim();
        if (dispInput) exp.pixDisplay = dispInput.value.trim() || exp.pix || "A definir";
      });

      closeEditModal();
      render();
      syncToCloud();
    }

    window.onclick = function(event) {
      const editModal = document.getElementById("edit-modal");
      const grocModal = document.getElementById("grocery-modal");
      if (event.target === editModal) closeEditModal();
      if (event.target === grocModal) closeGroceryModal();
    };

    // Inicialização
    loadLocal();
    render();

    syncFromCloud();
    setInterval(syncFromCloud, 5000);
  </script>
</body>
</html>
